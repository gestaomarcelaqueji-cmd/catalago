name: Importar codigo da loja
on:
  push:
    paths:
      - catalago-source-bundle.txt
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Extrair codigo original
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import base64, lzma, tarfile
          txt = Path('catalago-source-bundle.txt').read_text(encoding='ascii')
          start='CATALAGO_SOURCE_ARCHIVE_XZ_BASE64\n'
          end='\nEND_OF_ARCHIVE'
          assert txt.startswith(start) and end in txt
          data=base64.b64decode(txt[len(start):txt.index(end)].replace('\n',''), validate=True)
          raw=lzma.decompress(data)
          with tarfile.open(fileobj=BytesIO(raw)) as archive:
              members=archive.getmembers()
              for m in members:
                  name=Path(m.name)
                  assert not name.is_absolute() and '..' not in name.parts and (m.isfile() or m.isdir()), m.name
              archive.extractall('.', filter='data')
          print(f'Arquivos extraidos: {len(members)}')
          PY
      - name: Publicar arquivos no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao necessaria"
          else
            git commit -m "feat: publicar codigo Next.js da loja"
            git push origin HEAD:main
          fi
